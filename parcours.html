<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le parcours — MIROIR</title>
<meta name="description" content="Le journal de la transformation, mis à jour plusieurs fois par semaine.">
<meta property="og:title" content="Le parcours — MIROIR">
<meta property="og:description" content="Le journal de la transformation, en public.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<div class="wrap wrap--lecture">
  <div class="scene scene--calme" aria-hidden="true">
    <div class="glow"></div><div class="ring"></div>
  </div>

  <header class="bar">
    <a class="mark" href="index.html">Miroir</a>
    <a class="retour" href="methodes.html">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.5 8h-11M7 3.5 2.5 8 7 12.5"/>
      </svg>
      Les méthodes
    </a>
  </header>

  <main style="padding-top:44px">
    <div class="eyebrow rise d1">Le journal</div>
    <h1 class="rise d2" style="margin-top:16px">Le parcours</h1>
    <p class="lede rise d3" style="margin-top:22px">
      Ce que je fais, au jour le jour. Les notes restent ici, les épisodes ont leur page.
      Rien n'est rétroactivement modifié.
    </p>

    <div id="fil" style="margin-top:12px">
      <div class="etat">Chargement du fil…</div>
    </div>

    <button class="plus" id="plus" hidden>Voir plus</button>
  </main>

  <footer class="pied">
    <span>MIROIR — 2026</span>
    <a href="instagram.html">iamlouis</a>
  </footer>
</div>

<script>
// ─── SUPABASE ────────────────────────────────────────────
const SUPABASE_URL = 'https://mcueihmixpmqtpwcxfcm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zk23O7Fli7Qc6Z_xyPyr-w_wSQDMOsE';
const PAR_PAGE = 20;
// ─────────────────────────────────────────────────────────

const fil = document.getElementById('fil');
const plus = document.getElementById('plus');
let offset = 0, moisCourant = null;

const MOIS = ['janvier','février','mars','avril','mai','juin',
              'juillet','août','septembre','octobre','novembre','décembre'];

const dateCourte = (d) => `${d.getDate()} ${MOIS[d.getMonth()]}`;
const dateMois   = (d) => `${MOIS[d.getMonth()]} ${d.getFullYear()}`;

// Le contenu vient de la base : on l'insère en texte, jamais en HTML.
const el = (tag, cls) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  return n;
};

function rendreNote(p, d) {
  const art = el('article', 'note-post');
  art.id = 'j-' + p.id;

  const date = el('div', 'date');
  date.append(dateCourte(d));
  const lien = el('a');
  lien.href = '#j-' + p.id;
  lien.textContent = 'Lien';
  lien.setAttribute('aria-label', 'Lien vers cette note');
  date.append(lien);
  art.append(date);

  const corps = el('p', 'corps');
  corps.textContent = p.texte;
  art.append(corps);

  if (p.media_url) {
    const img = el('img');
    img.src = p.media_url;
    img.alt = '';
    img.loading = 'lazy';
    art.append(img);
  }
  return art;
}

function rendreEpisode(p, d) {
  const a = el('a', 'epi-post');
  a.href = p.slug ? 'episode.html?e=' + encodeURIComponent(p.slug) : '#';

  const lab = el('div', 'lab');
  lab.textContent = 'Épisode · ' + dateCourte(d);
  a.append(lab);

  const h = el('h3');
  h.textContent = p.titre || 'Épisode';
  a.append(h);

  const t = el('p');
  t.textContent = p.texte.slice(0, 150) + (p.texte.length > 150 ? '…' : '');
  a.append(t);

  const fin = el('span', 'fin');
  fin.textContent = p.video_id ? 'Regarder →' : 'Lire →';
  a.append(fin);
  return a;
}

async function charger() {
  plus.disabled = true;
  try {
    const url = `${SUPABASE_URL}/rest/v1/posts`
      + `?select=id,type,titre,texte,media_url,video_id,slug,published_at`
      + `&order=published_at.desc&limit=${PAR_PAGE}&offset=${offset}`;

    const res = await fetch(url, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error(res.status);
    const posts = await res.json();

    if (offset === 0) fil.textContent = '';

    if (offset === 0 && posts.length === 0) {
      const v = el('div', 'etat');
      v.textContent = 'Le premier post arrive bientôt.';
      fil.append(v);
      return;
    }

    let groupe = null;
    posts.forEach(p => {
      const d = new Date(p.published_at);
      const m = dateMois(d);
      if (m !== moisCourant) {
        moisCourant = m;
        const sep = el('div', 'mois');
        const s = el('span');
        s.textContent = m;
        sep.append(s);
        fil.append(sep);
        groupe = el('div', 'fil');
        fil.append(groupe);
      }
      groupe.append(p.type === 'episode' ? rendreEpisode(p, d) : rendreNote(p, d));
    });

    offset += posts.length;
    plus.hidden = posts.length < PAR_PAGE;

    // si l'URL pointe vers une note d'une page suivante, on y saute
    if (location.hash) {
      const cible = document.querySelector(location.hash);
      if (cible) cible.scrollIntoView();
    }
  } catch {
    if (offset === 0) {
      fil.textContent = '';
      const e = el('div', 'etat err');
      e.textContent = 'Le fil n\'a pas pu être chargé. Réessaie dans un instant.';
      fil.append(e);
    }
  } finally {
    plus.disabled = false;
  }
}

plus.addEventListener('click', charger);
charger();
</script>
</body>
</html>
